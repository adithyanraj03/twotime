<svg xmlns="http://www.w3.org/2000/svg" width="2312" height="688" viewBox="0 0 2312 688"><rect x="0" y="0" width="2312" height="688" fill="#F7F6F1"/><text x="12" y="18" font-family="Courier,monospace" font-size="14" fill="#252524" font-weight="bold">two-time pad attack — contact sheet (6 frames)</text><g transform="translate(12,26)"><rect x="0" y="0" width="760" height="320" fill="none" stroke="#DCDAD1" stroke-width="1"/><rect x="0" y="0" width="760" height="320" fill="#F7F6F1"/><text x="24" y="22" font-family="Courier,monospace" font-size="13" fill="#252524" font-weight="bold">two-time pad — frame 0/5: setup: one (key, nonce) for two messages<line x1="24" y1="30" x2="736" y2="30" stroke="#DCDAD1" stroke-width="1"/><text x="24" y="40" font-family="Courier,monospace" font-size="12" fill="#252524">P1 (114 B)  "Ladies and Gentlemen of the class of '99: ..."</text><text x="24" y="62" font-family="Courier,monospace" font-size="12" fill="#252524">P2 (172 B)  "The sun never sets on a one-time pad; ..."</text><text x="24" y="84" font-family="Courier,monospace" font-size="12" fill="#676662">key   = 00 01 02 ... 1e 1f   (one 32-byte key)</text><text x="24" y="106" font-family="Courier,monospace" font-size="12" fill="#676662">nonce = 00 00 00 00 00 00 00 4a 00 00 00 00   (one 12-byte nonce)</text><text x="24" y="136" font-family="Courier,monospace" font-size="12" fill="#A74221">ONE keystream K is derived from (key, nonce) — and reused for both.</text><text x="24" y="308" font-family="Courier,monospace" font-size="9" fill="#676662">twotime — ChaCha20-Poly1305 (RFC 8439), std-only  (c) 2026 Adithya N Raj</text></g><g transform="translate(782,26)"><rect x="0" y="0" width="760" height="320" fill="none" stroke="#DCDAD1" stroke-width="1"/><rect x="0" y="0" width="760" height="320" fill="#F7F6F1"/><text x="24" y="22" font-family="Courier,monospace" font-size="13" fill="#252524" font-weight="bold">two-time pad — frame 1/5: C1 = P1 XOR K<line x1="24" y1="30" x2="736" y2="30" stroke="#DCDAD1" stroke-width="1"/><text x="24" y="40" font-family="Courier,monospace" font-size="12" fill="#5B51C7">K      = 224f51f3401bd9e1 ...  (114 B keystream)</text><text x="24" y="62" font-family="Courier,monospace" font-size="12" fill="#252524">P1     = 4c61646965732061 ...</text><text x="24" y="84" font-family="Courier,monospace" font-size="12" fill="#22AC80">C1 = P1 XOR K = 6e2e359a2568f980 ...  (114 B ciphertext)</text><text x="24" y="116" font-family="Courier,monospace" font-size="12" fill="#676662">attacker sees C1, but without K or P1 nothing is known.</text><text x="24" y="308" font-family="Courier,monospace" font-size="9" fill="#676662">twotime — ChaCha20-Poly1305 (RFC 8439), std-only  (c) 2026 Adithya N Raj</text></g><g transform="translate(1552,26)"><rect x="0" y="0" width="760" height="320" fill="none" stroke="#DCDAD1" stroke-width="1"/><rect x="0" y="0" width="760" height="320" fill="#F7F6F1"/><text x="24" y="22" font-family="Courier,monospace" font-size="13" fill="#252524" font-weight="bold">two-time pad — frame 2/5: C2 = P2 XOR K  (K is reused)<line x1="24" y1="30" x2="736" y2="30" stroke="#DCDAD1" stroke-width="1"/><text x="24" y="40" font-family="Courier,monospace" font-size="12" fill="#5B51C7">K      = 224f51f3401bd9e1 ...  (SAME keystream)</text><text x="24" y="62" font-family="Courier,monospace" font-size="12" fill="#252524">P2     = 5468652073756e20 ...</text><text x="24" y="84" font-family="Courier,monospace" font-size="12" fill="#22AC80">C2 = P2 XOR K = 762734d3336eb7c1 ...  (172 B ciphertext)</text><text x="24" y="116" font-family="Courier,monospace" font-size="12" fill="#A74221">the pad is now used TWICE — the one-time pad is broken.</text><text x="24" y="308" font-family="Courier,monospace" font-size="9" fill="#676662">twotime — ChaCha20-Poly1305 (RFC 8439), std-only  (c) 2026 Adithya N Raj</text></g><g transform="translate(12,356)"><rect x="0" y="0" width="760" height="320" fill="none" stroke="#DCDAD1" stroke-width="1"/><rect x="0" y="0" width="760" height="320" fill="#F7F6F1"/><text x="24" y="22" font-family="Courier,monospace" font-size="13" fill="#252524" font-weight="bold">two-time pad — frame 3/5: C1 XOR C2: the keystream cancels<line x1="24" y1="30" x2="736" y2="30" stroke="#DCDAD1" stroke-width="1"/><text x="24" y="40" font-family="Courier,monospace" font-size="12" fill="#252524">C1 XOR K = P1</text><text x="24" y="62" font-family="Courier,monospace" font-size="12" fill="#252524">C2 XOR K = P2</text><text x="24" y="84" font-family="Courier,monospace" font-size="12" fill="#DCDAD1">─────────────────────────────</text><text x="24" y="106" font-family="Courier,monospace" font-size="13" fill="#E8833A">C1 XOR C2 = P1 XOR P2     (K XOR K = 0 — it vanishes)</text><text x="24" y="136" font-family="Courier,monospace" font-size="12" fill="#676662">no key material is involved in the subtraction.</text><text x="24" y="308" font-family="Courier,monospace" font-size="9" fill="#676662">twotime — ChaCha20-Poly1305 (RFC 8439), std-only  (c) 2026 Adithya N Raj</text></g><g transform="translate(782,356)"><rect x="0" y="0" width="760" height="320" fill="none" stroke="#DCDAD1" stroke-width="1"/><rect x="0" y="0" width="760" height="320" fill="#F7F6F1"/><text x="24" y="22" font-family="Courier,monospace" font-size="13" fill="#252524" font-weight="bold">two-time pad — frame 4/5: P1 XOR P2 is exposed; P1 is known<line x1="24" y1="30" x2="736" y2="30" stroke="#DCDAD1" stroke-width="1"/><text x="24" y="40" font-family="Courier,monospace" font-size="12" fill="#E8833A">D = C1 XOR C2 = 1809014916064e41 ...  (byte-exact)</text><text x="24" y="62" font-family="Courier,monospace" font-size="12" fill="#252524">D = P1 XOR P2</text><text x="24" y="84" font-family="Courier,monospace" font-size="12" fill="#676662">attacker knows P1 (predictable header / template / crib)</text><text x="24" y="106" font-family="Courier,monospace" font-size="13" fill="#22AC80">P2 = D XOR P1</text><text x="24" y="308" font-family="Courier,monospace" font-size="9" fill="#676662">twotime — ChaCha20-Poly1305 (RFC 8439), std-only  (c) 2026 Adithya N Raj</text></g><g transform="translate(1552,356)"><rect x="0" y="0" width="760" height="320" fill="none" stroke="#DCDAD1" stroke-width="1"/><rect x="0" y="0" width="760" height="320" fill="#F7F6F1"/><text x="24" y="22" font-family="Courier,monospace" font-size="13" fill="#252524" font-weight="bold">two-time pad — frame 5/5: P2 = P1 XOR C1 XOR C2 — recovered<line x1="24" y1="30" x2="736" y2="30" stroke="#DCDAD1" stroke-width="1"/><text x="24" y="40" font-family="Courier,monospace" font-size="13" fill="#22AC80">P2[0..16] = 5468652073756e206e65766572207365 ...</text><text x="24" y="84" font-family="Courier,monospace" font-size="12" fill="#252524">matches the real P2 byte-for-byte over the full overlap.</text><text x="24" y="116" font-family="Courier,monospace" font-size="12" fill="#A74221">two pads, one keystream: both secrets walk out in the clear.</text><text x="24" y="308" font-family="Courier,monospace" font-size="9" fill="#676662">twotime — ChaCha20-Poly1305 (RFC 8439), std-only  (c) 2026 Adithya N Raj</text></g><text x="12" y="680" font-family="Courier,monospace" font-size="9" fill="#676662">twotime — deterministic reproduction  (c) 2026 Adithya N Raj</text></svg>